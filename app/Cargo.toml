[package]
name = "trio-app"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Native window for a Trio room"
license = "Apache-2.0"
repository = "https://github.com/SanjithTammana/trio"

[[bin]]
name = "trio-app"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "accesskit", "clipboard"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

# Linux needs a windowing backend compiled in; system packages alone cannot enable one.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
